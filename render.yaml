services:
  - type: web
    name: circle-space-website
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: site-data
      mountPath: /var/data
      sizeGB: 1
